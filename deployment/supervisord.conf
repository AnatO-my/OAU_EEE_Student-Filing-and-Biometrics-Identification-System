[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0
childlogdir=/tmp

[program:api]
command=gunicorn --config deployment/gunicorn.conf.py config.wsgi:application
directory=/srv/eee
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=95
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:edge]
command=/usr/local/bin/caddy run --config /srv/eee/deployment/Caddyfile.hosted --adapter caddyfile
directory=/srv/eee
environment=API_UPSTREAM="127.0.0.1:8000"
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
