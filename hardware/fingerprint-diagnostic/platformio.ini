[platformio]
default_envs = esp32-sh1106

[env]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
monitor_filters = direct
build_src_filter = +<main.cpp>
build_flags =
    -Wall
    -Wextra

; The board used in the supplied Proteus schematic.
; This profile assumes the N8 variant (8 MB flash, no PSRAM).
[env:esp32-s3]
board = esp32-s3-devkitc-1

; Regular ESP32-WROOM with the alternative SSD1306 display adapter.
[env:esp32]
board = esp32dev
build_flags = ${env.build_flags} -DDEFERRED_ENABLED=1 -DTERMINAL_ENABLED=1 -DWIFI_TRANSFER_ENABLED=1
; Keep uploads at the rate verified on this connected board.
upload_speed = 115200

; Default: full attendance terminal; user confirmed this display driver works best.
[env:esp32-sh1106]
extends = env:esp32
build_flags = ${env:esp32.build_flags} -DTERMINAL_OLED_SH1106=1

; Offline unidentified capture batches; same diagnostic controls, no legacy UI.
[env:esp32-deferred]
board = esp32dev
build_flags = ${env.build_flags} -DDEFERRED_ENABLED=1 -DTERMINAL_ENABLED=0
upload_speed = 57600

; OLED-only check using the original MicroPython display pins and SSD1306 setup.
[env:esp32-oled-test]
board = esp32dev
build_src_filter = +<oled_test.cpp>
upload_speed = 115200

; Pixel-row integrity check using the same SH1106 page driver as the terminal.
[env:esp32-oled-integrity]
board = esp32dev
build_src_filter = +<oled_integrity.cpp>
build_flags = ${env.build_flags} -DTERMINAL_ENABLED=0 -DTERMINAL_OLED_SH1106=1
upload_speed = 57600

; Adafruit text/counter test based on the supplied oled_partial.cpp sketch.
[env:esp32-oled-partial]
board = esp32dev
build_src_filter = +<oled_partial.cpp>
upload_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit GFX Library@1.12.6

; Separate accuracy sketches; explicit e enrolls, scan blocks preserve the gallery.
[env:esp32-accuracy-identify]
board = esp32dev
build_src_filter = +<accuracy_main.cpp>
build_flags = ${env.build_flags} -DTERMINAL_ENABLED=0 -DACCURACY_VERIFICATION=0

[env:esp32-accuracy-verify]
board = esp32dev
build_src_filter = +<accuracy_main.cpp>
build_flags = ${env.build_flags} -DTERMINAL_ENABLED=0 -DACCURACY_VERIFICATION=1
